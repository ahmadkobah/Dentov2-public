server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security Headers (L-2) ─────────────────────────────────
  # See apps/admin/nginx.conf for rationale.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_EXTRA_CONNECT}; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri ${CSP_API_ORIGIN}/api/csp-report" always;  # Phase 2 prep — strict Report-Only policy for measurement.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_EXTRA_CONNECT}; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri ${CSP_API_ORIGIN}/api/csp-report" always;  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ── SPA fallback ───────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Static asset caching ───────────────────────────────────
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── Compression ────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
