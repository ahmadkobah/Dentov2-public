name: Deploy Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ─── API ──────────────────────────────────────────────
  deploy-api:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:staging
            ghcr.io/${{ github.repository }}/api:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway Staging
        run: railway up --service dento-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}

      - name: Health Check
        run: |
          echo "Waiting for staging API to be ready..."
          for i in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_API_URL }}/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ Staging API is healthy"
              exit 0
            fi
            echo "Attempt $i/20 — status: $status, retrying in 10s..."
            sleep 10
          done
          echo "❌ Staging API health check failed"
          exit 1

  # ─── Admin Portal ─────────────────────────────────────
  deploy-admin:
    name: Deploy Admin to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @dento/shared build && pnpm --filter @dento/ui build

      - name: Build Admin
        run: pnpm --filter @dento/admin build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.ADMIN_SENTRY_DSN }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Admin Preview
        id: deploy-admin
        run: |
          vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: apps/admin
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}

      - name: Admin Staging URL
        run: echo "🚀 Admin staging → ${{ steps.deploy-admin.outputs.url }}"

  # ─── Developer Portal ─────────────────────────────────
  deploy-developer:
    name: Deploy Developer to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @dento/shared build && pnpm --filter @dento/ui build

      - name: Build Developer
        run: pnpm --filter @dento/developer build
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.DEVELOPER_SENTRY_DSN }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy Developer Preview
        id: deploy-developer
        run: |
          vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: apps/developer
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DEVELOPER_PROJECT_ID }}

      - name: Developer Staging URL
        run: echo "🚀 Developer staging → ${{ steps.deploy-developer.outputs.url }}"
