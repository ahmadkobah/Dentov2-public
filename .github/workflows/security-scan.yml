name: Security Scan (OWASP ZAP + Nuclei)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for security scan'
        required: false
        default: 'http://localhost:3000'

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_URL: ${{ github.event.inputs.target_url || 'http://localhost:3000' }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Dependency Audit
  # ──────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high + critical)
        run: pnpm audit --audit-level=high

  # ──────────────────────────────────────────────
  # 2. OWASP ZAP Baseline Scan
  # ──────────────────────────────────────────────
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @dento/shared build && pnpm --filter @dento/api build

      - name: Start API server
        run: |
          cd apps/api
          node dist/server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          sleep 5
        env:
          NODE_ENV: test
          SCAN_SAFE_RESPONSES: 'true'
          PORT: 3000
          HOST: 0.0.0.0
          MONGODB_URI: mongodb://localhost:27017/dento_zap_test
          REDIS_URL: redis://localhost:6379
          PAYLOAD_SECRET: zap-test-payload-secret-not-real-32chars
          JWT_ACCESS_SECRET: zap-test-access-secret-not-real
          JWT_REFRESH_SECRET: zap-test-refresh-secret-not-real
          PLATFORM_API_KEY: zap-test-platform-key
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SEARCH_HASH_KEY: 0fedcba9876543210fedcba9876543210fedcba9876543210fedcba987654321

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health/live > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API failed to start. Logs:"
          cat /tmp/api.log || true
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: 'scripts/security/zap-baseline.conf'
          # -a: include alpha passive scan rules
          # -I: do not return failure on warning (only fail on FAIL-rated rules)
          cmd_options: '-a -I'
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report_html.html
          retention-days: 30

  # ──────────────────────────────────────────────
  # 3. Nuclei Scan
  # ──────────────────────────────────────────────
  nuclei-scan:
    name: Nuclei Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @dento/shared build && pnpm --filter @dento/api build

      - name: Start API server
        run: |
          cd apps/api
          node dist/server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          sleep 5
        env:
          NODE_ENV: test
          SCAN_SAFE_RESPONSES: 'true'
          PORT: 3000
          HOST: 0.0.0.0
          MONGODB_URI: mongodb://localhost:27017/dento_nuclei_test
          REDIS_URL: redis://localhost:6379
          PAYLOAD_SECRET: nuclei-test-payload-secret-not-real-32chars
          JWT_ACCESS_SECRET: nuclei-test-access-secret-not-real
          JWT_REFRESH_SECRET: nuclei-test-refresh-secret-not-real
          PLATFORM_API_KEY: nuclei-test-platform-key
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SEARCH_HASH_KEY: 0fedcba9876543210fedcba9876543210fedcba9876543210fedcba987654321

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health/live > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API failed to start. Logs:"
          cat /tmp/api.log || true
          exit 1

      - name: Install Nuclei
        env:
          NUCLEI_VERSION: 3.8.0
          NUCLEI_SHA256: cd4ea43c88b50af8ab96eb6ad3fb4debd8e9d51efaff4d4c2d99106041578943
        run: |
          curl -sSL -o nuclei.zip "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          echo "${NUCLEI_SHA256}  nuclei.zip" | sha256sum -c -
          unzip -q nuclei.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/nuclei"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update Nuclei Templates
        run: nuclei -update-templates

      - name: Run Nuclei Scan
        run: |
          nuclei \
            -u http://localhost:3000 \
            -severity critical,high,medium \
            -type http \
            -silent \
            -markdown-export nuclei-report \
            -stats

      - name: Check for Critical/High Findings
        run: |
          if [ -d "nuclei-report" ] && find nuclei-report -name "*.md" | head -1 | grep -q .; then
            echo "::warning::Nuclei found potential vulnerabilities. Check the report artifact."
            cat nuclei-report/**/*.md 2>/dev/null || true
          else
            echo "No critical/high vulnerabilities found."
          fi

      - name: Upload Nuclei Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-scan-report
          path: nuclei-report/
          retention-days: 30
          if-no-files-found: ignore
